name: Release

# A tag v<version> builds the package once, publishes it to TestPyPI, then to PyPI,
# through trusted publishing, and creates the GitHub Release with the notes of that
# version's section of CHANGELOG.md. No token is stored. The tag must name the version
# that pyproject.toml declares, and the changelog must hold that version, or nothing
# is built.
on:
  push:
    tags: ["v*"]

jobs:
  check:
    name: The tag names the declared version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: |
          declared="$(uv version --short)"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "tag v$tagged does not match the version $declared declared in pyproject.toml" >&2
            exit 1
          fi
          echo "releasing $declared"
      - name: The changelog holds the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { p = 1; next }
            /^## \[/ || /^\[/ { if (p) exit }
            p' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for version $version" >&2
            exit 1
          fi
          echo "release notes:" && cat notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  build:
    name: Build the distributions
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/gemba-cli/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gemba-cli/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - run: uv publish --trusted-publishing always

  github:
    name: Create the GitHub Release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - run: gh release create "$GITHUB_REF_NAME" --title "Gemba ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
