name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job only reads the repository; none writes to it.
permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv build

  tests:
    name: Test suite on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests

  tests-macos:
    # One run on macOS, on the oldest supported Python: what differs from Linux is
    # the operating system (case-insensitive filesystem, BSD tools, symlinked /tmp),
    # not the interpreter, so one version is enough.
    name: Test suite on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests
