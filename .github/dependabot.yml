# Dependabot keeps the lock file and the actions of the workflows current, in one
# pull request per ecosystem and week, so that CI validates each bump. For uv it
# updates every package of the lock file, the dependencies of the dependencies
# included (allow: all): a version update otherwise changes only the dependencies
# that pyproject.toml declares. The cooldown matches the 30-day release quarantine
# of pyproject.toml (exclude-newer): without it Dependabot proposes versions that
# uv refuses to lock, and the update fails.
# The cooldown covers version updates only. Security updates ignore it and would
# ask uv for a release still in quarantine, so they are disabled in the repository
# settings; the alerts stay on, and the weekly update picks the patched release, of
# a direct or a transitive dependency, once it leaves the quarantine. To take a
# patch earlier, exempt that package with exclude-newer-package in pyproject.toml.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
    allow:
      - dependency-type: "all"
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
    groups:
      actions:
        patterns: ["*"]
