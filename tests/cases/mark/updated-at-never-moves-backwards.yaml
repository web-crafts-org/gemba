name: a transition dated before updated_at leaves updated_at where it is and dates done_at as asked
scenario: "task-marking: Updated at never moves backwards"
config:
  default_workstream: operations
  workstreams:
    support: { prefix: SUP, description: Investigate a client-reported problem }
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
tree:
  tasks/support/2026-09-30-SUP-1-login-fails.md: |
    ---
    status: in-progress
    ref: SUP-1
    updated_at: 2026-10-02
    metadata: {}
    ---

    ## Updates

    ### 2026-10-02

    - Confirmed the fix with the client.
run: [mark, SUP-1, done, --date, 2026-10-01]
exit: 0
stdout: |
  tasks/support/2026-09-30-SUP-1-login-fails.md
  status: in-progress -> done
  done_at: 2026-10-01
  updated_at: 2026-10-02 (unchanged)
files_contain:
  tasks/support/2026-09-30-SUP-1-login-fails.md: ["\nupdated_at: 2026-10-02\ndone_at: 2026-10-01\n"]
