name: gemba hook pre-push in the clone of an obeya without a team prints nothing for a pushed ref that changes gemba.yaml
scenario: "obeya-sync: Hook silent without a team"
repos:
  obeya:
    branches:
      main:
        gemba.yaml: |
          default_workstream: support
          agent_providers: [claude]
          workstreams:
            support: { prefix: SUP, description: Investigate a client-reported problem }
        .gitignore: |
          harnesses/
          gemba.local.yaml
          /update.md
        tasks/manuel/support/2026-10-20-MR-SUP-1-export.md: |
          ---
          status: open
          ref: MR-SUP-1
          updated_at: 2026-10-20
          metadata: {}
          ---

          Export times out.

          ## Updates
        tasks/ana/support/2026-10-21-AG-SUP-1-login.md: |
          ---
          status: open
          ref: AG-SUP-1
          updated_at: 2026-10-21
          metadata: {}
          ---

          Login fails on Safari.

          ## Updates
cwd: repos/obeya
tree_after_setup:
  repos/obeya/gemba.yaml: |
    default_workstream: support
    agent_providers: [claude]
    workstreams:
      support: { prefix: SUP, description: Investigate a client-reported problem }
    create:
      rules:
        - name the client in the title
git_after_setup:
  - [repos/obeya, add, gemba.yaml]
  - [repos/obeya, commit, --quiet, -m, "Name the client in the title"]
run: [hook, pre-push, origin, ../../remotes/obeya.git]
stdin: "refs/heads/main {rev:repos/obeya:HEAD} refs/heads/main {rev:repos/obeya:origin/main}\n"
exit: 0
stdout: ""
stderr_excludes:
  - "gemba"
