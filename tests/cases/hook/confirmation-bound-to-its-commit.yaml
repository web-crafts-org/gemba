name: a confirmation that names the first of two commits pushed refuses the shared file and the task of ana alike
scenario: "obeya-sync: Confirmation bound to its commit"
repos:
  obeya:
    branches:
      main:
        gemba.yaml: |
          default_workstream: support
          agent_providers: [claude]
          workstreams:
            support: { prefix: SUP, description: Investigate a client-reported problem }
          team:
            manuel: { initials: MR }
            ana: { initials: AG }
          git_hooks: true
        .gitignore: |
          harnesses/
          gemba.local.yaml
          /update.md
        tasks/manuel/support/2026-10-20-MR-SUP-1-export.md: |
          ---
          status: open
          ref: MR-SUP-1
          updated_at: 2026-10-20
          metadata: {}
          ---

          Export times out.

          ## Updates
        tasks/ana/support/2026-10-21-AG-SUP-1-login.md: |
          ---
          status: open
          ref: AG-SUP-1
          updated_at: 2026-10-21
          metadata: {}
          ---

          Login fails on Safari.

          ## Updates
cwd: repos/obeya
tree:
  repos/obeya/gemba.local.yaml: "me: manuel\n"
setup:
  - [init]
tree_after_setup:
  repos/obeya/gemba.yaml: |
    default_workstream: support
    agent_providers: [claude]
    workstreams:
      support: { prefix: SUP, description: Investigate a client-reported problem }
    team:
      manuel: { initials: MR }
      ana: { initials: AG }
    git_hooks: true
    create:
      rules:
        - name the client in the title
  repos/obeya/tasks/ana/support/2026-10-21-AG-SUP-1-login.md: |
    ---
    status: done
    ref: AG-SUP-1
    updated_at: 2026-10-21
    done_at: 2026-10-21
    metadata: {}
    ---

    Login fails on Safari.

    ## Updates
git_after_setup:
  - [repos/obeya, add, gemba.yaml]
  - [repos/obeya, commit, --quiet, -m, "Name the client in the title"]
  - [repos/obeya, add, tasks/ana/support/2026-10-21-AG-SUP-1-login.md]
  - [repos/obeya, commit, --quiet, -m, "Close AG-SUP-1"]
run: [git, -c, "gemba.shared={rev:repos/obeya:HEAD~1}", push]
exit: 1
stderr_contains:
  - "- {short:repos/obeya:HEAD} changes tasks/ana/support/2026-10-21-AG-SUP-1-login.md, in the folder of ana: only ana writes it"
  - "- {short:repos/obeya:HEAD~1} changes the shared file gemba.yaml"
  - "confirm them with git -c gemba.shared={rev:repos/obeya:HEAD} push"
git_log:
  remotes/obeya.git:
    - "add main"
