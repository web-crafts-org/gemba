name: a push of a commit that edits a task of ana and another that forced gemba.local.yaml lists both problems, then the skill and the bypass
scenario: "obeya-sync: Every problem of a push listed"
repos:
  obeya:
    branches:
      main:
        gemba.yaml: |
          default_workstream: support
          agent_providers: [claude]
          workstreams:
            support: { prefix: SUP, description: Investigate a client-reported problem }
          team:
            manuel: { initials: MR }
            ana: { initials: AG }
          git_hooks: true
        .gitignore: |
          harnesses/
          gemba.local.yaml
          /update.md
        tasks/manuel/support/2026-10-20-MR-SUP-1-export.md: |
          ---
          status: open
          ref: MR-SUP-1
          updated_at: 2026-10-20
          metadata: {}
          ---

          Export times out.

          ## Updates
        tasks/ana/support/2026-10-21-AG-SUP-1-login.md: |
          ---
          status: open
          ref: AG-SUP-1
          updated_at: 2026-10-21
          metadata: {}
          ---

          Login fails on Safari.

          ## Updates
cwd: repos/obeya
tree:
  repos/obeya/gemba.local.yaml: "me: manuel\n"
setup:
  - [init]
tree_after_setup:
  repos/obeya/tasks/ana/support/2026-10-21-AG-SUP-1-login.md: |
    ---
    status: done
    ref: AG-SUP-1
    updated_at: 2026-10-21
    done_at: 2026-10-21
    metadata: {}
    ---

    Login fails on Safari.

    ## Updates
git_after_setup:
  - [repos/obeya, add, tasks/ana/support/2026-10-21-AG-SUP-1-login.md]
  - [repos/obeya, commit, --quiet, -m, "Close AG-SUP-1"]
  - [repos/obeya, add, -f, gemba.local.yaml]
  - [repos/obeya, commit, --quiet, -m, "Share my config"]
run: [git, push]
exit: 1
stderr_contains:
  - "gemba hook pre-push: push to refs/heads/main refused:\n- {short:repos/obeya:HEAD~1} changes tasks/ana/support/2026-10-21-AG-SUP-1-login.md, in the folder of ana: only ana writes it\n- {short:repos/obeya:HEAD} changes gemba.local.yaml, private to each clone: it never leaves the clone\nthe gemba-sync skill explains each problem; git push --no-verify skips these checks\n"
git_log:
  remotes/obeya.git:
    - "add main"
