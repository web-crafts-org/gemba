name: the merge of a pull that brings a change of ana beside a change of the member is pushed, the hook printing nothing
scenario: "obeya-sync: Merge of a pull pushed"
repos:
  obeya:
    branches:
      main:
        gemba.yaml: |
          default_workstream: support
          agent_providers: [claude]
          workstreams:
            support: { prefix: SUP, description: Investigate a client-reported problem }
          team:
            manuel: { initials: MR }
            ana: { initials: AG }
          git_hooks: true
        .gitignore: |
          harnesses/
          gemba.local.yaml
          /update.md
        tasks/manuel/support/2026-10-20-MR-SUP-1-export.md: |
          ---
          status: open
          ref: MR-SUP-1
          updated_at: 2026-10-20
          metadata: {}
          ---

          Export times out.

          ## Updates
        tasks/ana/support/2026-10-21-AG-SUP-1-login.md: |
          ---
          status: open
          ref: AG-SUP-1
          updated_at: 2026-10-21
          metadata: {}
          ---

          Login fails on Safari.

          ## Updates
    unfetched:
      main:
        tasks/ana/support/2026-10-21-AG-SUP-1-login.md: |
          ---
          status: done
          ref: AG-SUP-1
          updated_at: 2026-10-21
          done_at: 2026-10-21
          metadata: {}
          ---

          Login fails on Safari.

          ## Updates
cwd: repos/obeya
tree:
  repos/obeya/gemba.local.yaml: "me: manuel\n"
setup:
  - [init]
tree_after_setup:
  repos/obeya/tasks/manuel/support/2026-10-20-MR-SUP-1-export.md: |
    ---
    status: blocked
    ref: MR-SUP-1
    updated_at: 2026-10-20
    metadata: {}
    ---

    Export times out.

    ## Updates
git_after_setup:
  - [repos/obeya, add, tasks/manuel/support/2026-10-20-MR-SUP-1-export.md]
  - [repos/obeya, commit, --quiet, -m, "Block MR-SUP-1"]
  - [repos/obeya, pull, --quiet, --no-rebase, --no-edit]
  - [repos/obeya, commit, --quiet, --amend, -m, "Merge the work of ana"]
run: [git, push]
exit: 0
stderr_excludes:
  - "gemba hook pre-push"
git_log:
  remotes/obeya.git:
    - "Merge the work of ana"
    - "Block MR-SUP-1"
    - "unfetched main"
    - "add main"
