name: remove --yes --force deletes a harness whose worktree holds an unpushed commit, and the branch, never the remote's
scenario: "harness-removal: Pending work discarded with force"
config:
  default_workstream: operations
  agent_providers: [claude]
  obeya: nakatomi
  workstreams:
    support: { prefix: SUP, description: Investigate a client-reported problem }
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
local_config:
  repos_dir: repos
repos:
  nakatomi-web:
    branches:
      main: { README.md: "Nakatomi web\n" }
tree:
  tasks/support/2026-09-30-SUP-1-login-fails.md: |
    ---
    status: open
    ref: SUP-1
    updated_at: 2026-09-30
    metadata: {}
    ---

    ## Updates
setup:
  - [harness, launch, SUP-1, --no-open]
  - [worktree, add, nakatomi-web, --harness, harnesses/support/2026-09-30-SUP-1-login-fails]
tree_after_setup:
  harnesses/support/2026-09-30-SUP-1-login-fails/worktrees/nakatomi-web/draft.txt: "Work in progress.\n"
git_after_setup:
  - [harnesses/support/2026-09-30-SUP-1-login-fails/worktrees/nakatomi-web, commit, --quiet, --allow-empty, -m, local work]
run: [harness, remove, SUP-1, --yes, --force]
exit: 0
stdout: |
  harnesses/support/2026-09-30-SUP-1-login-fails
  task: tasks/support/2026-09-30-SUP-1-login-fails.md
  launched_at: {today}
  notes: 0
  assets: 0
  commits: 1
  worktrees: 1
  uncommitted: 0
  removed
absent:
  - harnesses/support/2026-09-30-SUP-1-login-fails
  - repos/nakatomi-web/.git/worktrees/*
git_branches:
  repos/nakatomi-web: [main]
  remotes/nakatomi-web.git: [main]
