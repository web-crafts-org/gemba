name: an ide command that resolves to nothing on PATH is reported after the harness is created, naming the command
scenario: "harness-launch: IDE command not found"
config:
  default_workstream: operations
  agent_providers: [claude]
  ide: no-such-ide -n
  workstreams:
    support: { prefix: SUP, description: Investigate a client-reported problem }
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
tree:
  tasks/support/2026-09-30-SUP-1-login-fails.md: |
    ---
    status: open
    ref: SUP-1
    updated_at: 2026-09-30
    metadata: {}
    ---

    ## Updates
run: [harness, launch, SUP-1]
exit: 1
stdout: |
  harnesses/support/2026-09-30-SUP-1-login-fails
  status: open -> in-progress
stderr_contains:
  - "gemba harness launch: the harness is ready but the IDE command 'no-such-ide -n' could not be started"
  - no-such-ide
files_contain:
  harnesses/support/2026-09-30-SUP-1-login-fails/harness.yaml: ["ref: SUP-1\n"]
  harnesses/support/2026-09-30-SUP-1-login-fails/CLAUDE.md: ["# Working in this harness\n"]
git_log:
  harnesses/support/2026-09-30-SUP-1-login-fails: [launch SUP-1]
