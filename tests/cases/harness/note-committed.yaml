name: filing a note makes the second commit of the harness and leaves nothing uncommitted
scenario: "harness-notes: Note committed"
config:
  default_workstream: operations
  agent_providers: [claude]
  workstreams:
    support: { prefix: SUP, description: Investigate a client-reported problem }
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
tree:
  tasks/support/2026-09-30-SUP-1-login-fails.md: |
    ---
    status: in-progress
    ref: SUP-1
    updated_at: 2026-09-30
    metadata: {}
    ---

    ## Updates
  harnesses/support/2026-09-30-SUP-1-login-fails/notes/login-trace.md: |
    The login request returns 500.
setup:
  - [harness, launch, SUP-1, --no-open]
run: [harness, note, notes/login-trace.md, --type, finding, --harness, harnesses/support/2026-09-30-SUP-1-login-fails]
exit: 0
git_log:
  harnesses/support/2026-09-30-SUP-1-login-fails: [note finding login-trace, launch SUP-1]
git_clean: [harnesses/support/2026-09-30-SUP-1-login-fails]
