name: a harness verb run inside a harness without --harness acts on that harness
scenario: "harness-launch: Harness resolved from the working directory"
config:
  default_workstream: operations
  agent_providers: [claude]
  workstreams:
    support: { prefix: SUP, description: Investigate a client-reported problem }
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
tree:
  tasks/support/2026-09-30-SUP-1-login-fails.md: |
    ---
    status: in-progress
    ref: SUP-1
    updated_at: 2026-09-30
    metadata: {}
    ---

    ## Updates
  harnesses/support/2026-09-30-SUP-1-login-fails/notes/login-trace.md: |
    The login request returns 500.
cwd: harnesses/support/2026-09-30-SUP-1-login-fails/notes
setup:
  - [harness, launch, SUP-1, --no-open]
run: [harness, note, notes/login-trace.md, --type, finding]
exit: 0
stdout_contains: ["notes/{today}-", "-login-trace.md\n"]
files_contain:
  "harnesses/support/2026-09-30-SUP-1-login-fails/notes/{today}-[0-9][0-9][0-9][0-9][0-9][0-9]-login-trace.md": ["---\ntype: finding\n"]
git_log:
  harnesses/support/2026-09-30-SUP-1-login-fails: [note finding login-trace, launch SUP-1]
