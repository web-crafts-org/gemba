name: launch rewrites the frontmatter keys in their order and leaves the body as it was
scenario: "task-file-format: Launch rewrites only the frontmatter"
config:
  default_workstream: operations
  agent_providers: [claude]
  workstreams:
    support:
      prefix: SUP
      description: Investigate a client-reported problem
      metadata:
        - name: client
          type: text
        - name: project
          type: text
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
