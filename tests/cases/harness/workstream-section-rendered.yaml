name: the workstream's guide text closes every guide as its own section
scenario: "harness-guide: Workstream section rendered"
config:
  default_workstream: operations
  agent_providers: [claude, agents]
  workstreams:
    support:
      prefix: SUP
      description: Investigate a client-reported problem
      harness:
        guide: Write for the client.
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
tree:
  tasks/support/2026-09-30-SUP-1-login-fails.md: |
    ---
    status: open
    ref: SUP-1
    updated_at: 2026-09-30
    metadata: {}
    ---

    ## Updates
run: [harness, launch, SUP-1, --no-open]
exit: 0
files_contain:
  harnesses/support/2026-09-30-SUP-1-login-fails/CLAUDE.md: &section ["uncommitted. Do not commit here yourself.\n\n## Your workstream\n\nWrite for the client.\n"]
  harnesses/support/2026-09-30-SUP-1-login-fails/AGENTS.md: *section
