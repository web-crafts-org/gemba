name: identifier with uppercase and underscore is refused
scenario: "gemba-config: Invalid identifier or prefix"
config:
  default_workstream: operations
  workstreams:
    Client_Support: { prefix: SUP, description: Investigate a client-reported problem }
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
run: [create, --workstream, operations, --slug, renew-domain, --date, 2026-09-30]
exit: 1
stderr_contains: ["workstream 'Client_Support'", kebab-case]
unchanged: true
