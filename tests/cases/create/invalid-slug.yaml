name: slug with uppercase letters is refused
scenario: "task-file-format: Invalid slug"
config:
  default_workstream: operations
  workstreams:
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
run: [create, --workstream, operations, "--slug=Login-Fails", --date, 2026-09-30]
exit: 1
stderr_contains: ["invalid slug 'Login-Fails'"]
unchanged: true
