name: add without --from starts the branch of the run at the default branch of origin
scenario: "harness-worktrees: Worktree added from the default branch"
config:
  default_workstream: operations
  agent_providers: [claude]
  organization: nakatomi
  workstreams:
    support: { prefix: SUP, description: Investigate a client-reported problem }
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
local_config:
  repos_dir: repos
repos:
  nakatomi-web:
    branches:
      main: { README.md: "Nakatomi web\n", src/app.js: "console.log('main');\n" }
      develop: { README.md: "Nakatomi web, develop\n" }
tree:
  tasks/support/2026-09-30-SUP-1-login-fails.md: |
    ---
    status: open
    ref: SUP-1
    updated_at: 2026-09-30
    metadata: {}
    ---

    ## Updates
cwd: harnesses/support/2026-09-30-SUP-1-login-fails
setup:
  - [harness, launch, SUP-1, --no-open]
run: [worktree, add, nakatomi-web]
exit: 0
stdout: |
  worktrees/nakatomi-web
  branch: gemba/nakatomi/SUP-1
  from: origin/main
  created
files:
  harnesses/support/2026-09-30-SUP-1-login-fails/worktrees/nakatomi-web/README.md: "Nakatomi web\n"
  harnesses/support/2026-09-30-SUP-1-login-fails/worktrees/nakatomi-web/src/app.js: "console.log('main');\n"
files_contain:
  repos/nakatomi-web/.git/worktrees/nakatomi-web/HEAD: ["ref: refs/heads/gemba/nakatomi/SUP-1\n"]
git_branches:
  repos/nakatomi-web: [gemba/nakatomi/SUP-1, main]
  remotes/nakatomi-web.git: [develop, main]
git_clean: [harnesses/support/2026-09-30-SUP-1-login-fails]
git_log:
  harnesses/support/2026-09-30-SUP-1-login-fails: [launch SUP-1]
