name: add --from --force moves a worktree holding an unpushed commit and discards the commit
scenario: "harness-worktrees: Base change forced"
config:
  default_workstream: operations
  agent_providers: [claude]
  obeya: nakatomi
  workstreams:
    support: { prefix: SUP, description: Investigate a client-reported problem }
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
local_config:
  repos_dir: repos
repos:
  nakatomi-web:
    branches:
      main: { README.md: "Nakatomi web\n" }
      feature/a: { README.md: "Nakatomi web, feature a\n", feature.txt: "a\n" }
tree:
  tasks/support/2026-09-30-SUP-1-login-fails.md: |
    ---
    status: open
    ref: SUP-1
    updated_at: 2026-09-30
    metadata: {}
    ---

    ## Updates
cwd: harnesses/support/2026-09-30-SUP-1-login-fails
setup:
  - [harness, launch, SUP-1, --no-open]
  - [worktree, add, nakatomi-web]
git_after_setup:
  - [harnesses/support/2026-09-30-SUP-1-login-fails/worktrees/nakatomi-web, commit, --quiet, --allow-empty, -m, local work]
run: [worktree, add, nakatomi-web, --from, feature/a, --force]
exit: 0
stdout: |
  worktrees/nakatomi-web
  branch: gemba/nakatomi/SUP-1
  from: origin/feature/a
  moved
files:
  harnesses/support/2026-09-30-SUP-1-login-fails/worktrees/nakatomi-web/README.md: "Nakatomi web, feature a\n"
  harnesses/support/2026-09-30-SUP-1-login-fails/worktrees/nakatomi-web/feature.txt: "a\n"
git_log:
  harnesses/support/2026-09-30-SUP-1-login-fails/worktrees/nakatomi-web: [add feature/a, add main]
