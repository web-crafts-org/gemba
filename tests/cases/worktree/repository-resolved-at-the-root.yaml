name: a repository directly under repos_dir is added as a worktree of the harness
scenario: "harness-worktrees: Repository resolved at the root of the folder"
config:
  default_workstream: operations
  agent_providers: [claude]
  organization: nakatomi
  workstreams:
    support: { prefix: SUP, description: Investigate a client-reported problem }
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
local_config:
  repos_dir: repos
repos:
  nakatomi-web:
    branches:
      main: { README.md: "Nakatomi web\n" }
  group/other:
    branches:
      main: { README.md: "Other\n" }
tree:
  tasks/support/2026-09-30-SUP-1-login-fails.md: |
    ---
    status: open
    ref: SUP-1
    updated_at: 2026-09-30
    metadata: {}
    ---

    ## Updates
cwd: harnesses/support/2026-09-30-SUP-1-login-fails
setup:
  - [harness, launch, SUP-1, --no-open]
run: [worktree, add, nakatomi-web]
exit: 0
files:
  harnesses/support/2026-09-30-SUP-1-login-fails/worktrees/nakatomi-web/README.md: "Nakatomi web\n"
git_branches:
  repos/nakatomi-web: [gemba/nakatomi/SUP-1, main]
