name: add --from refuses to move a worktree holding an uncommitted file and keeps it
scenario: "harness-worktrees: Base change refused with pending work"
config:
  default_workstream: operations
  agent_providers: [claude]
  organization: nakatomi
  repos_dir: repos
  workstreams:
    support: { prefix: SUP, description: Investigate a client-reported problem }
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
repos:
  nakatomi-web:
    branches:
      main: { README.md: "Nakatomi web\n" }
      feature/a: { README.md: "Nakatomi web, feature a\n" }
tree:
  tasks/support/2026-09-30-SUP-1-login-fails.md: |
    ---
    status: open
    ref: SUP-1
    updated_at: 2026-09-30
    metadata: {}
    ---

    ## Updates
cwd: harnesses/support/2026-09-30-SUP-1-login-fails
setup:
  - [harness, launch, SUP-1, --no-open]
  - [worktree, add, nakatomi-web]
tree_after_setup:
  harnesses/support/2026-09-30-SUP-1-login-fails/worktrees/nakatomi-web/draft.txt: "Work in progress.\n"
run: [worktree, add, nakatomi-web, --from, feature/a]
exit: 1
stdout_contains: ["worktrees/nakatomi-web\n", "uncommitted: 1\n"]
stderr_contains: ["worktree not moved:", "worktrees/nakatomi-web has 1 uncommitted path: draft.txt"]
files:
  harnesses/support/2026-09-30-SUP-1-login-fails/worktrees/nakatomi-web/README.md: "Nakatomi web\n"
  harnesses/support/2026-09-30-SUP-1-login-fails/worktrees/nakatomi-web/draft.txt: "Work in progress.\n"
git_log:
  harnesses/support/2026-09-30-SUP-1-login-fails/worktrees/nakatomi-web: [add main]
