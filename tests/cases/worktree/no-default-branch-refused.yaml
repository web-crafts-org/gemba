name: add without --from in a repository that records no default branch asks for --from
scenario: "harness-worktrees: No default branch refused"
config:
  default_workstream: operations
  agent_providers: [claude]
  organization: nakatomi
  repos_dir: repos
  workstreams:
    support: { prefix: SUP, description: Investigate a client-reported problem }
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
repos:
  nakatomi-web:
    branches:
      main: { README.md: "Nakatomi web\n" }
tree:
  tasks/support/2026-09-30-SUP-1-login-fails.md: |
    ---
    status: open
    ref: SUP-1
    updated_at: 2026-09-30
    metadata: {}
    ---

    ## Updates
cwd: harnesses/support/2026-09-30-SUP-1-login-fails
setup:
  - [harness, launch, SUP-1, --no-open]
git_after_setup:
  - [repos/nakatomi-web, remote, set-head, origin, --delete]
run: [worktree, add, nakatomi-web]
exit: 1
stderr_contains: ["worktree not added:", "the repository records no default branch for origin", "--from names the base"]
absent:
  - harnesses/support/2026-09-30-SUP-1-login-fails/worktrees/*
git_branches:
  repos/nakatomi-web: [main]
