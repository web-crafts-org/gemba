name: with the hooks on, a pre-push hook of another tool that also runs gemba hook pre-push is kept and the other two are written
scenario: "repo-initialization: Chained hook kept"
repos:
  obeya:
    branches:
      main:
        gemba.yaml: |
          default_workstream: support
          agent_providers: [claude]
          workstreams:
            support: { prefix: SUP, description: Investigate a client-reported problem }
          team:
            manuel: { initials: MR }
            ana: { initials: AG }
          git_hooks: true
        .gitignore: "harnesses/\ngemba.local.yaml\n/update.md\n"
cwd: repos/obeya
tree:
  repos/obeya/gemba.local.yaml: "me: manuel\n"
  repos/obeya/.git/hooks/pre-push: "#!/bin/sh\nlint-staged || exit 1\ngemba hook pre-push \"$@\"\n"
run: [init]
exit: 0
stdout_contains:
  - "written .claude/skills/gemba-migrate/SKILL.md\nkept .git/hooks/pre-push\nwritten .git/hooks/post-merge\nwritten .git/hooks/post-rewrite\nnext step:"
files:
  repos/obeya/.git/hooks/pre-push: "#!/bin/sh\nlint-staged || exit 1\ngemba hook pre-push \"$@\"\n"
files_contain:
  repos/obeya/.git/hooks/post-merge: ["#!/bin/sh\n# Written by gemba init for the git hooks of a team (git_hooks); gemba init removes it.\n", "exec gemba hook post-merge \"$@\"\n"]
  repos/obeya/.git/hooks/post-rewrite: ["#!/bin/sh\n# Written by gemba init for the git hooks of a team (git_hooks); gemba init removes it.\n", "exec gemba hook post-rewrite \"$@\"\n"]
lf_only:
  - repos/obeya/.git/hooks/post-merge
  - repos/obeya/.git/hooks/post-rewrite
