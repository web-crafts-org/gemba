name: init in an obeya made by an earlier version appends the personal config and the draft to the .gitignore and keeps the rest
scenario: "repo-initialization: Personal config ignored in an earlier obeya"
cwd: .
setup:
  - [init, --providers, claude]
tree_after_setup:
  .gitignore: "harnesses/\n"
run: [init]
exit: 0
stdout: |
  kept gemba.yaml
  updated .gitignore
  kept .gitattributes
  kept tasks/.gitkeep
  kept .claude/skills/gemba-create/SKILL.md
  kept .claude/skills/gemba-list/SKILL.md
  kept .claude/skills/gemba-harness/SKILL.md
  kept .claude/skills/gemba-record/SKILL.md
  kept .claude/skills/gemba-report/SKILL.md
  kept .claude/skills/gemba-mark/SKILL.md
  kept .claude/skills/gemba-archive/SKILL.md
  kept .claude/skills/gemba-set/SKILL.md
  kept .claude/skills/gemba-init/SKILL.md
  kept .claude/skills/gemba-config/SKILL.md
  kept .claude/skills/gemba-migrate/SKILL.md
  next step: open this obeya with your agent and ask it to configure gemba (the gemba-init skill)
files:
  .gitignore: "harnesses/\ngemba.local.yaml\n/update.md\n"
  .gitattributes: "*.md text eol=lf\n*.yaml text eol=lf\n"
absent: [gemba.local.yaml, .agents]
