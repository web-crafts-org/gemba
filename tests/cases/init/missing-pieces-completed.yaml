name: init in a half-made obeya keeps the config, appends the three ignore lines and the missing attribute line, and writes what is missing
scenario: "repo-initialization: Missing pieces completed"
config: |
  # Edited by hand.
  default_workstream: operations
  agent_providers: [claude]
  workstreams:
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
tree:
  .gitignore: "cli/.venv/\n"
  .gitattributes: "*.md text eol=lf\n"
cwd: .
run: [init]
exit: 0
stdout: |
  kept gemba.yaml
  updated .gitignore
  updated .gitattributes
  written tasks/.gitkeep
  written .claude/skills/gemba-create/SKILL.md
  written .claude/skills/gemba-list/SKILL.md
  written .claude/skills/gemba-harness/SKILL.md
  written .claude/skills/gemba-record/SKILL.md
  written .claude/skills/gemba-report/SKILL.md
  written .claude/skills/gemba-mark/SKILL.md
  written .claude/skills/gemba-archive/SKILL.md
  written .claude/skills/gemba-set/SKILL.md
  written .claude/skills/gemba-init/SKILL.md
  written .claude/skills/gemba-config/SKILL.md
  written .claude/skills/gemba-migrate/SKILL.md
  next step: open this obeya with your agent and ask it to configure gemba (the gemba-init skill)
files:
  gemba.yaml: |
    # Edited by hand.
    default_workstream: operations
    agent_providers: [claude]
    workstreams:
      operations: { prefix: OPS, description: Anything that does not fit another workstream }
  .gitignore: "cli/.venv/\nharnesses/\ngemba.local.yaml\n/update.md\n"
  .gitattributes: "*.md text eol=lf\n*.yaml text eol=lf\n"
  tasks/.gitkeep: ""
files_contain:
  .claude/skills/gemba-create/SKILL.md: ["---\nname: gemba-create\n"]
  .claude/skills/gemba-config/SKILL.md: ["---\nname: gemba-config\n"]
absent: [.agents]
