name: sync shows the patch of an incoming change to a task of the member, counts a commit of another member, lists the outgoing commit and says the push is ready
scenario: "obeya-sync: Sync before a pull"
repos:
  obeya:
    branches:
      main:
        gemba.yaml: |
          default_workstream: support
          workstreams:
            support: { prefix: SUP, description: Investigate a client-reported problem }
          team:
            manuel: { initials: MR }
            ana: { initials: AG }
        .gitignore: |
          harnesses/
          gemba.local.yaml
          /update.md
        README.md: |
          The obeya of the support team.
        tasks/manuel/support/2026-10-20-MR-SUP-1-export.md: |
          ---
          status: open
          ref: MR-SUP-1
          updated_at: 2026-10-20
          metadata: {}
          ---

          Export times out.

          ## Updates
        tasks/ana/support/2026-10-21-AG-SUP-1-login.md: |
          ---
          status: open
          ref: AG-SUP-1
          updated_at: 2026-10-21
          metadata: {}
          ---

          Login fails on Safari.

          ## Updates
    unfetched:
      main:
        tasks/ana/support/2026-10-21-AG-SUP-1-login.md: |
          ---
          status: done
          ref: AG-SUP-1
          updated_at: 2026-10-21
          done_at: 2026-10-21
          metadata: {}
          ---

          Login fails on Safari.

          ## Updates
cwd: repos/obeya
tree:
  repos/obeya/gemba.local.yaml: "me: manuel\n"
tree_after_setup:
  edits/tasks/manuel/support/2026-10-20-MR-SUP-1-export.md: |
    ---
    status: blocked
    ref: MR-SUP-1
    updated_at: 2026-10-20
    metadata: {}
    ---

    Export times out.

    ## Updates
  repos/obeya/tasks/manuel/support/2026-10-25-MR-SUP-2-invoices.md: |
    ---
    status: open
    ref: MR-SUP-2
    updated_at: 2026-10-25
    metadata: {}
    ---

    Invoices are sent twice.

    ## Updates
git_after_setup:
  - [., clone, --quiet, remotes/obeya.git, ana]
  - [ana, "--work-tree={root}/edits", add, tasks/manuel/support/2026-10-20-MR-SUP-1-export.md]
  - [ana, commit, --quiet, --author, "Ana Gómez <ana@example.com>", -m, "Block MR-SUP-1"]
  - [ana, push, --quiet]
  - [repos/obeya, fetch, --quiet]
  - [repos/obeya, add, tasks/manuel/support/2026-10-25-MR-SUP-2-invoices.md]
  - [repos/obeya, commit, --quiet, -m, "Add MR-SUP-2"]
run: [sync]
exit: 0
stdout_contains:
  - "branch main, upstream origin/main\nincoming: 2 commits\n- your tasks:\n  tasks/manuel/support/2026-10-20-MR-SUP-1-export.md, by {short:repos/obeya:origin/main} (Ana Gómez)\n"
  - "\n    -status: open\n    +status: blocked\n"
  - "- 1 commit changes only the tasks of other members\noutgoing: 1 commit\n- {short:repos/obeya:HEAD} Gemba Cases: Add MR-SUP-2\nuncommitted: none\npush: ready\n"
