name: sync warns that a fetched commit that forced gemba.local.yaml into the history would write a pull over the clone's own
scenario: "obeya-sync: Personal config coming in warned about"
repos:
  obeya:
    branches:
      main:
        gemba.yaml: |
          default_workstream: support
          workstreams:
            support: { prefix: SUP, description: Investigate a client-reported problem }
          team:
            manuel: { initials: MR }
            ana: { initials: AG }
        .gitignore: |
          harnesses/
          gemba.local.yaml
          /update.md
        README.md: |
          The obeya of the support team.
        tasks/manuel/support/2026-10-20-MR-SUP-1-export.md: |
          ---
          status: open
          ref: MR-SUP-1
          updated_at: 2026-10-20
          metadata: {}
          ---

          Export times out.

          ## Updates
        tasks/ana/support/2026-10-21-AG-SUP-1-login.md: |
          ---
          status: open
          ref: AG-SUP-1
          updated_at: 2026-10-21
          metadata: {}
          ---

          Login fails on Safari.

          ## Updates
cwd: repos/obeya
tree:
  repos/obeya/gemba.local.yaml: "me: manuel\n"
tree_after_setup:
  edits/gemba.local.yaml: "me: ana\n"
git_after_setup:
  - [., clone, --quiet, remotes/obeya.git, ana]
  - [ana, "--work-tree={root}/edits", add, -f, gemba.local.yaml]
  - [ana, commit, --quiet, --author, "Ana Gómez <ana@example.com>", -m, "Share my config"]
  - [ana, push, --quiet]
  - [repos/obeya, fetch, --quiet]
run: [sync]
exit: 0
stdout_contains:
  - "incoming: 1 commit\n- gemba.local.yaml, private to each clone, by {short:repos/obeya:origin/main} (Ana Gómez): a pull writes it over yours\n"
