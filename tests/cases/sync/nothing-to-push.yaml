name: sync on a branch at its upstream says that nothing comes in or goes out and that there is nothing to push
scenario: "obeya-sync: Nothing to push"
repos:
  obeya:
    branches:
      main:
        gemba.yaml: |
          default_workstream: support
          workstreams:
            support: { prefix: SUP, description: Investigate a client-reported problem }
          team:
            manuel: { initials: MR }
            ana: { initials: AG }
        .gitignore: |
          harnesses/
          gemba.local.yaml
          /update.md
        README.md: |
          The obeya of the support team.
        tasks/manuel/support/2026-10-20-MR-SUP-1-export.md: |
          ---
          status: open
          ref: MR-SUP-1
          updated_at: 2026-10-20
          metadata: {}
          ---

          Export times out.

          ## Updates
        tasks/ana/support/2026-10-21-AG-SUP-1-login.md: |
          ---
          status: open
          ref: AG-SUP-1
          updated_at: 2026-10-21
          metadata: {}
          ---

          Login fails on Safari.

          ## Updates
cwd: repos/obeya
tree:
  repos/obeya/gemba.local.yaml: "me: manuel\n"
run: [sync]
exit: 0
stdout: |
  branch main, upstream origin/main
  incoming: none
  outgoing: none
  uncommitted: none
  push: nothing to push
unchanged: true
