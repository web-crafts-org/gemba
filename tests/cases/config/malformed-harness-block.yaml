name: harness.guide written as a list stops the command and names the key
scenario: "gemba-config: Malformed harness block"
config:
  default_workstream: operations
  workstreams:
    code-reviews:
      prefix: CR
      description: Review a merge request before it is merged
      harness:
        guide: [one line, another line]
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
run: [create, --workstream, code-reviews, --slug, review-checkout, --date, 2026-09-30]
exit: 1
stderr_contains: [invalid gemba config, "workstream 'code-reviews'", harness.guide must be a non-empty string]
unchanged: true
---
name: harness.note.rules written as a string stops the command and names the key
scenario: "gemba-config: Malformed harness block"
config:
  default_workstream: operations
  workstreams:
    code-reviews:
      prefix: CR
      description: Review a merge request before it is merged
      harness:
        note:
          rules: quote the line of the diff each finding is about
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
tree:
  tasks/code-reviews/.gitkeep: ""
run: [list]
exit: 1
stderr_contains: [invalid gemba config, "workstream 'code-reviews'", harness.note.rules must be a list of non-empty strings]
unchanged: true
---
name: a key inside harness that is neither guide nor a verb stops the command and names it
scenario: "gemba-config: Malformed harness block"
config:
  default_workstream: operations
  workstreams:
    code-reviews:
      prefix: CR
      description: Review a merge request before it is merged
      harness:
        rules: [quote the line of the diff each finding is about]
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
run: [create, --workstream, code-reviews, --slug, review-checkout, --date, 2026-09-30]
exit: 1
stderr_contains: [invalid gemba config, "workstream 'code-reviews'", "harness.rules", "allowed: guide, launch, note, resolve"]
unchanged: true
