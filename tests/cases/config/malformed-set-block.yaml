name: set.rules written as a string stops the command and names the block
scenario: "gemba-config: Malformed set block"
config:
  default_workstream: operations
  workstreams:
    support:
      prefix: SUP
      description: Investigate a client-reported problem
      set:
        rules: set the invoice date only when the task is done
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
run: [create, --workstream, support, --slug, login-fails, --date, 2026-09-30]
exit: 1
stderr_contains: [invalid gemba config, "workstream 'support'", set.rules must be a list of non-empty strings]
unchanged: true
---
name: set.context written as a list stops the command and names the block
scenario: "gemba-config: Malformed set block"
config:
  default_workstream: operations
  workstreams:
    support:
      prefix: SUP
      description: Investigate a client-reported problem
      set:
        context: [one line, another line]
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
tree:
  tasks/support/.gitkeep: ""
run: [list]
exit: 1
stderr_contains: [invalid gemba config, "workstream 'support'", set.context must be a string]
unchanged: true
