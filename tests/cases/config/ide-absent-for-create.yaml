name: a config without an IDE command still creates tasks
scenario: "gemba-config: IDE absent for a process that does not open it"
config:
  default_workstream: operations
  workstreams:
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
run: [create, --workstream, operations, --slug, renew-domain, --date, 2026-09-30]
exit: 0
stdout_contains: [tasks/operations/2026-09-30-OPS-1-renew-domain.md, OPS-1]
