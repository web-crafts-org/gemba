name: mark and archive blocks with rules and context do not stop the create process
scenario: "gemba-config: Mark and archive blocks accepted"
config:
  default_workstream: operations
  workstreams:
    support:
      prefix: SUP
      description: Investigate a client-reported problem
      mark:
        rules: [before done, confirm the client was told]
      archive:
        context: Support tasks are archived once the client has closed the ticket.
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
run: [create, --workstream, support, --slug, login-fails, --date, 2026-09-30]
exit: 0
