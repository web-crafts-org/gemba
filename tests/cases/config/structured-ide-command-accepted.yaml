name: show prints a structured ide command as declared
scenario: "gemba-config: Structured IDE command accepted"
config:
  default_workstream: operations
  workstreams:
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
local_config:
  ide: { command: code, args: [-n] }
run: [config, show]
exit: 0
stdout_json:
  organization: null
  branch_prefix: gemba
  repos_dir: null
  ide: { command: code, args: [-n] }
  agent_providers: null
  harness_providers: null
  default_workstream: operations
  workstreams:
    - id: operations
      prefix: OPS
      description: Anything that does not fit another workstream
      metadata: []
      processes:
        create: &empty { context: null, rules: [] }
        list: *empty
        record: *empty
        report: *empty
        mark: *empty
        archive: *empty
        set: *empty
        harness:
          guide: { organization: null, workstream: null, user: null }
          launch: *empty
          note: *empty
          resolve: *empty
          remove: *empty
        worktree:
          add: *empty
          list: *empty
          remove: *empty
unchanged: true
