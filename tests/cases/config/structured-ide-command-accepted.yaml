name: a structured ide command without args is accepted and shown as declared
scenario: "gemba-config: Structured IDE command accepted"
config:
  default_workstream: operations
  workstreams:
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
local_config:
  ide: { command: code }
run: [config, check]
exit: 0
stdout_contains: ["gemba.yaml is valid\n"]
unchanged: true
---
name: launch starts a structured ide command with the harness path and prints the command line as declared
scenario: "gemba-config: Structured IDE command accepted"
config:
  default_workstream: operations
  agent_providers: [claude]
  workstreams:
    support: { prefix: SUP, description: Investigate a client-reported problem }
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
local_config:
  ide: { command: code, args: [-n] }
tree:
  tasks/support/2026-09-30-SUP-1-login-fails.md: |
    ---
    status: open
    ref: SUP-1
    updated_at: 2026-09-30
    metadata: {}
    ---

    ## Updates
run: [harness, launch, SUP-1]
exit: 0
stdout_contains:
  - "harnesses/support/2026-09-30-SUP-1-login-fails\nstatus: open -> in-progress\nopening: code -n {root}"
  - "2026-09-30-SUP-1-login-fails\n"
files_contain:
  harnesses/support/2026-09-30-SUP-1-login-fails/harness.yaml: ["ref: SUP-1\n"]
---
