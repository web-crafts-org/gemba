name: an organization that is not kebab-case is refused naming organization
scenario: "gemba-config: Malformed organization or branch prefix refused"
config:
  default_workstream: operations
  organization: Nakatomi Corp
  workstreams:
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
run: [create, --workstream, operations, --slug, renew-domain, --date, 2026-09-30]
exit: 1
stderr_contains: [invalid gemba config, organization must be kebab-case]
unchanged: true
