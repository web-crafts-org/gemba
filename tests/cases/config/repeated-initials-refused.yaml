name: two members with the same initials are refused, naming both members and the initials
scenario: "gemba-config: Repeated initials refused"
config:
  default_workstream: support
  workstreams:
    support: { prefix: SUP, description: Investigate a client-reported problem }
  team:
    manuel: { initials: MR }
    mario: { initials: MR }
run: [list]
exit: 1
stderr_contains:
  - "invalid gemba config:\n"
  - "gemba.yaml: team members 'manuel' and 'mario' declare the same initials 'MR'"
unchanged: true
