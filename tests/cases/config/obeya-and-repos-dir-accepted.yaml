name: obeya, repos_dir and branch_prefix do not stop the create process
scenario: "gemba-config: Obeya and repositories folder accepted"
config:
  default_workstream: operations
  obeya: nakatomi
  workstreams:
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
local_config:
  repos_dir: ~/projects
  branch_prefix: nk
run: [create, --workstream, operations, --slug, renew-domain, --date, 2026-09-30]
exit: 0
stdout_contains: [tasks/operations/2026-09-30-OPS-1-renew-domain.md, OPS-1]
files:
  tasks/operations/2026-09-30-OPS-1-renew-domain.md: |
    ---
    status: open
    ref: OPS-1
    updated_at: 2026-09-30
    metadata: {}
    ---

    ## Updates
