name: a member whose folder name is the identifier of a workstream is refused, naming the member
scenario: "gemba-config: Member named after a workstream refused"
config:
  default_workstream: support
  workstreams:
    support: { prefix: SUP, description: Investigate a client-reported problem }
  team:
    manuel: { initials: MR }
    support: { initials: SP }
run: [list]
exit: 1
stderr_contains:
  - "invalid gemba config:\n"
  - "gemba.yaml: team member 'support': folder name is the identifier of a workstream"
unchanged: true
