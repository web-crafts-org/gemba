exit: 1
stderr_contains: [invalid gemba config, ide must be a non-empty string]
unchanged: true
---
name: an ide map without command is refused naming ide
scenario: "gemba-config: Malformed IDE command refused"
config:
  default_workstream: operations
  ide: { args: [-n] }
  workstreams:
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
tree:
  tasks/operations/.gitkeep: ""
run: [list]
exit: 1
stderr_contains: [invalid gemba config, ide.command must be a non-empty string]
unchanged: true
