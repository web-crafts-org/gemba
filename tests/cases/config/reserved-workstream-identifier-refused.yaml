name: the workstream identifier nul is refused as reserved on Windows
scenario: "gemba-config: Reserved device name refused"
config:
  default_workstream: operations
  workstreams:
    nul: { prefix: SUP, description: Investigate a client-reported problem }
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
run: [create, --workstream, operations, --slug, renew-domain, --date, 2026-09-30]
exit: 1
stderr_contains: [invalid gemba config, "workstream 'nul'", reserved on Windows]
unchanged: true
