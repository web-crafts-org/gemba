name: a key declared by one workstream filters every workstream
scenario: "task-listing: Key declared in one workstream only"
config:
  default_workstream: operations
  metadata:
    - name: client
      type: text
    - name: hours
      type: number
    - name: project
      type: text
  workstreams:
    code-reviews:
      prefix: CR
      description: Review a merge request before it is merged
      metadata:
        - name: merge_url
          type: text
    support: { prefix: SUP, description: Investigate a client-reported problem }
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
