name: numbers, booleans and lists keep their type in the record
scenario: "task-listing: Metadata values keep their type"
config:
  default_workstream: operations
  metadata:
    - name: hours
      type: number
    - name: billed
      type: boolean
    - name: project
      type: text
  workstreams:
    deployments: { prefix: DEP, description: Deploy one or more projects }
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
tree:
  tasks/deployments/2026-09-30-DEP-1-release-checkout.md: |
    ---
    status: open
    ref: DEP-1
    updated_at: 2026-09-30
    metadata:
      hours: 3
      billed: false
      project: [checkout, landing]
    ---

    ## Updates
run: [list]
exit: 0
stdout_json:
  tasks:
    - path: tasks/deployments/2026-09-30-DEP-1-release-checkout.md
      workstream: deployments
      archived: false
      ref: DEP-1
      date: 2026-09-30
      title: Release checkout
      status: open
      updated_at: 2026-09-30
      done_at: null
      metadata: { hours: 3, billed: false, project: [checkout, landing] }
      description: null
  problems: []
