name: the first update of a task becomes its first dated subsection and moves updated_at
scenario: "task-recording: First update of a task"
config:
  default_workstream: operations
  agent_providers: [claude]
  workstreams:
    support: { prefix: SUP, description: Investigate a client-reported problem }
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
tree:
  tasks/support/2026-09-30-SUP-1-login-fails.md: |
    ---
    status: in-progress
    ref: SUP-1
    updated_at: 2026-09-30
    metadata: {}
    ---

    Login fails on Safari for the checkout app.

    ## Updates
  harnesses/support/2026-09-30-SUP-1-login-fails/update.md: |
    - Reproduced the failure on Safari 17 with a fresh session.
    - Traced it to the session cookie, which is sent without the SameSite attribute.
setup:
  - [harness, launch, SUP-1, --no-open]
run: [record, update.md, --date, 2026-10-01, --harness, harnesses/support/2026-09-30-SUP-1-login-fails]
exit: 0
stdout: |
  tasks/support/2026-09-30-SUP-1-login-fails.md
  updated_at: 2026-09-30 -> 2026-10-01
files:
  tasks/support/2026-09-30-SUP-1-login-fails.md: |
    ---
    status: in-progress
    ref: SUP-1
    updated_at: 2026-10-01
    metadata: {}
    ---

    Login fails on Safari for the checkout app.

    ## Updates

    ### 2026-10-01

    - Reproduced the failure on Safari 17 with a fresh session.
    - Traced it to the session cookie, which is sent without the SameSite attribute.
