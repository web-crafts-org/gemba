name: the draft of a run is refused from the tasks repo, so that it is recorded from its harness
scenario: "task-recording: Draft out of place refused in the tasks repo"
config:
  default_workstream: operations
  agent_providers: [claude]
  workstreams:
    support: { prefix: SUP, description: Investigate a client-reported problem }
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
tree:
  tasks/support/2026-09-30-SUP-1-login-fails.md: |
    ---
    status: in-progress
    ref: SUP-1
    updated_at: 2026-09-30
    metadata: {}
    ---

    Login fails on Safari for the checkout app.

    ## Updates
  harnesses/support/2026-09-30-SUP-1-login-fails/update.md: |
    - Reproduced the failure on Safari 17.
setup:
  - [harness, launch, SUP-1, --no-open]
run: [record, SUP-1, harnesses/support/2026-09-30-SUP-1-login-fails/update.md, --date, 2026-10-01]
exit: 1
stderr_contains:
  - record not done
  - >-
    harnesses/support/2026-09-30-SUP-1-login-fails/update.md is not directly in the tasks repo root
    (paths are relative to the tasks repo root)
unchanged: true
