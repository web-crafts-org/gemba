name: a draft outside the tasks repo is refused and left where it is
scenario: "task-recording: Draft out of place refused in the tasks repo"
# The tasks repo is a subfolder of the case, so that the draft above it stays inside the case.
tree:
  acme-tasks/gemba.yaml: |
    default_workstream: operations
    agent_providers: [claude]
    workstreams:
      support: { prefix: SUP, description: Investigate a client-reported problem }
      operations: { prefix: OPS, description: Anything that does not fit another workstream }
  acme-tasks/tasks/support/2026-09-30-SUP-1-login-fails.md: |
    ---
    status: in-progress
    ref: SUP-1
    updated_at: 2026-09-30
    metadata: {}
    ---

    Login fails on Safari for the checkout app.

    ## Updates
  outside.md: |
    - Reviewed the fix of the session cookie with the client.
cwd: acme-tasks
run: [record, SUP-1, ../outside.md, --date, 2026-10-01]
exit: 1
stderr_contains:
  - record not done
  - ../outside.md is not directly in the tasks repo root (paths are relative to the tasks repo root)
unchanged: true
