name: record run inside a harness without --harness records on the task of that harness
scenario: "task-recording: Harness resolved from the working directory"
config:
  default_workstream: operations
  agent_providers: [claude]
  workstreams:
    support: { prefix: SUP, description: Investigate a client-reported problem }
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
tree:
  tasks/support/2026-09-30-SUP-1-login-fails.md: |
    ---
    status: in-progress
    ref: SUP-1
    updated_at: 2026-09-30
    metadata: {}
    ---

    Login fails on Safari for the checkout app.

    ## Updates
  harnesses/support/2026-09-30-SUP-1-login-fails/update.md: |
    - Reproduced the failure on Safari 17.
setup:
  - [harness, launch, SUP-1, --no-open]
cwd: harnesses/support/2026-09-30-SUP-1-login-fails/notes
run: [record, update.md, --date, 2026-10-01]
exit: 0
stdout: |
  tasks/support/2026-09-30-SUP-1-login-fails.md
  updated_at: 2026-09-30 -> 2026-10-01
files_contain:
  tasks/support/2026-09-30-SUP-1-login-fails.md: ["## Updates\n\n### 2026-10-01\n\n- Reproduced the failure on Safari 17.\n"]
absent: [harnesses/support/2026-09-30-SUP-1-login-fails/update.md]
