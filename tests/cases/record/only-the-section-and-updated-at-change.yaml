name: recording keeps the status, the metadata and every other line of the body
scenario: "task-recording: Only the section and updated_at change"
config:
  default_workstream: operations
  agent_providers: [claude]
  workstreams:
    support:
      prefix: SUP
      description: Investigate a client-reported problem
      metadata:
        - name: project
          type: text
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
