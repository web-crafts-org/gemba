name: a number grouping, a text sum, an undeclared grouping and an invalid status are reported together
scenario: "task-reporting: Invalid inputs reported together"
config:
  default_workstream: operations
  metadata:
    - { name: client, type: text }
    - { name: hours, type: number }
  workstreams:
    support: { prefix: SUP, description: Investigate a client-reported problem }
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
tree:
  tasks/support/2026-09-20-SUP-1-login-fails.md: |
    ---
    status: open
    ref: SUP-1
    updated_at: 2026-09-20
    metadata:
      client: acme
      hours: 3
    ---

    ## Updates
run: [report, --by, hours, --sum, client, --by, ticket, --status, closed]
exit: 1
stdout: ""
stderr_contains:
  - nothing reported
  - "cannot group by 'hours', a number field"
  - "cannot sum 'client', a text field"
  - "cannot group by 'ticket'"
  - "invalid status 'closed'"
unchanged: true
