name: the hours of a task split among members come from one report over its subtree, grouped by owner
scenario: "task-relations: Hours of a subtree by owner"
config:
  default_workstream: development
  metadata:
    - { name: hours, type: number }
  workstreams:
    development: { prefix: DEV, description: Build a feature }
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
    support: { prefix: SUP, description: Investigate a client-reported problem }
  team:
    manuel: { initials: MR }
    ana: { initials: AG }
local_config:
  me: manuel
tree:
  tasks/manuel/development/2026-10-20-MR-DEV-1-reports-export.md: "---\nstatus: in-progress\nref: MR-DEV-1\nupdated_at: 2026-10-20\nmetadata:\n  hours: 2\n---\n\n## Updates\n"
  tasks/ana/development/2026-10-21-AG-DEV-1-export-csv.md: "---\nstatus: in-progress\nref: AG-DEV-1\nparent: MR-DEV-1\nupdated_at: 2026-10-21\nmetadata:\n  hours: 3\n---\n\n## Updates\n"
  tasks/manuel/operations/2026-10-22-MR-OPS-1-schedule-the-export.md: "---\nstatus: open\nref: MR-OPS-1\nparent: AG-DEV-1\nupdated_at: 2026-10-22\nmetadata:\n  hours: 1\n---\n\n## Updates\n"
  tasks/ana/support/2026-10-23-AG-SUP-1-login-fails.md: "---\nstatus: open\nref: AG-SUP-1\nupdated_at: 2026-10-23\nmetadata:\n  hours: 5\n---\n\n## Updates\n"
run: [report, --under, MR-DEV-1, --sum, hours, --by, owner]
exit: 0
stdout_json:
  by: [owner]
  sum: [hours]
  groups:
    - key: { owner: manuel }
      tasks: 2
      refs: [MR-DEV-1, MR-OPS-1]
      sums: { hours: { total: 3, missing: 0 } }
    - key: { owner: ana }
      tasks: 1
      refs: [AG-DEV-1]
      sums: { hours: { total: 3, missing: 0 } }
  total: { tasks: 3, sums: { hours: { total: 6, missing: 0 } } }
  problems: []
unchanged: true
