name: a skill without a contentHash is kept and reported
scenario: "built-in-skills: Edited skill is kept and reported"
config:
  default_workstream: operations
  agent_providers: [claude]
  workstreams:
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
tree:
  .claude/skills/gemba-create/SKILL.md: |
    ---
    name: gemba-create
    description: Written by hand.
    ---

    My own steps.
run: [skills, update]
exit: 0
stdout_contains: ["kept .claude/skills/gemba-create/SKILL.md (edited by hand; --force overwrites it)\n"]
files:
  .claude/skills/gemba-create/SKILL.md: |
    ---
    name: gemba-create
    description: Written by hand.
    ---

    My own steps.
---
