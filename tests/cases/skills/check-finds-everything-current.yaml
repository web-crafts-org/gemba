name: check after an update reports every skill unchanged and exits 0
scenario: "built-in-skills: Check finds everything current"
config:
  default_workstream: operations
  agent_providers: [claude, agents]
  workstreams:
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
setup:
  - [skills, update]
run: [skills, update, --check]
exit: 0
stdout: |
  unchanged .claude/skills/gemba-create/SKILL.md
  unchanged .claude/skills/gemba-list/SKILL.md
