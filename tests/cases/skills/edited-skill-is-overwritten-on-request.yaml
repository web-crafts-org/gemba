name: --force replaces a skill edited by hand with the current content
scenario: "built-in-skills: Edited skill is overwritten on request"
config:
  default_workstream: operations
  agent_providers: [claude]
  workstreams:
    operations: { prefix: OPS, description: Anything that does not fit another workstream }
tree:
  .claude/skills/gemba-create/SKILL.md: |
    ---
    name: gemba-create
    description: Written by hand.
    ---

    My own steps.
run: [skills, update, --force]
exit: 0
stdout_contains: ["overwritten .claude/skills/gemba-create/SKILL.md\n"]
files_contain:
  .claude/skills/gemba-create/SKILL.md:
    - "---\nname: gemba-create\ndescription: Register a new task in this obeya."
    - "metadata:\n  generatedBy: \"{version}\"\n  contentHash: \""
    - "\n---\n\n# Create a task\n\nRegister one unit of work as a task file."
